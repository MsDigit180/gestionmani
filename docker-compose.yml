version: '3.8'

services:
  powersync:
    image: journeyapps/powersync-service:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      PS_DATA_SOURCE_URI: "postgres://postgres:postgre@HOST_POSTGRES:5432/postgres"
      PS_PORT: "8080"
      PS_JWKS_URI: "https://mani.com/.well-known/jwks.json" # Pour valider les tokens JWT